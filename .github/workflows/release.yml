name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ vars.JAVA_VERSION || '17' }}
          distribution: 'oracle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || '3.24.0' }}
          channel: stable

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Inject Firebase configs from Secrets
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # 1. Decode and write firebase_options.dart
          echo $FIREBASE_OPTIONS_DART | base64 --decode > lib/firebase_options.dart

          # 2. Decode and write google-services.json (Android)
          echo $GOOGLE_SERVICES_JSON | base64 --decode > android/app/google-services.json

          # (Optional) For iOS, uncomment the lines below if you added the iOS secret
          # echo ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }} | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Validate keystore filename
        run: |
          if [ -z "${{ vars.KEYSTORE_FILE_NAME }}" ]; then
            echo "ERROR: KEYSTORE_FILE_NAME variable is not set"
            exit 1
          fi
          echo "Using keystore filename: ${{ vars.KEYSTORE_FILE_NAME }}"

      - name: Create keystore file
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_FILE" | base64 -d > "android/app/${{ vars.KEYSTORE_FILE_NAME }}"

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=${{ vars.KEYSTORE_FILE_NAME }}" >> android/key.properties

      - name: Verify keystore and key.properties
        run: |
          echo "Keystore file:"
          ls -la "android/app/${{ vars.KEYSTORE_FILE_NAME }}" || echo "Keystore file not found"
          echo "key.properties file:"
          cat android/key.properties || echo "key.properties file not found"

      - name: Install dependencies
        run: flutter pub get --no-example --enforce-lockfile

      - name: Run generators
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --split-per-abi --release --split-debug-info=build/app/outputs/symbols --obfuscate

      - name: Bump version and generate changelog
        id: changelog
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.new_tag }}
          name: Release ${{ steps.changelog.outputs.new_tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            build/app/outputs/apk/release/*.apk
